<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>STACKMON - The Distributed Realm</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #cfe3ff;
        --dim: #5d7a9e;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #04060d;
        color: #cfe3ff;
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
      }
      #app { position: fixed; inset: 0; }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        text-align: center;
        background: #04060d;
        z-index: 10;
        transition: opacity 420ms ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot h1 {
        margin: 0;
        font-size: 34px;
        letter-spacing: 0.42em;
        font-weight: 600;
        color: #7ef0ff;
        text-shadow: 0 0 24px rgba(126, 240, 255, 0.55);
      }
      #boot p { margin: 0; font-size: 12px; letter-spacing: 0.22em; color: #4d6b96; }
      #boot .bar {
        width: 260px;
        height: 2px;
        margin: 6px auto 0;
        background: #16233b;
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, transparent, #7ef0ff, transparent);
        animation: sweep 1.1s ease-in-out infinite;
      }
      @keyframes sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(350%); }
      }
      #crash {
        position: fixed;
        inset: 0;
        display: none;
        padding: 40px;
        overflow: auto;
        background: #0a0409;
        z-index: 20;
        font-size: 13px;
        line-height: 1.6;
      }
      #crash.show { display: block; }
      #crash h2 { color: #ff6b8a; letter-spacing: 0.2em; margin: 0 0 12px; }
      #crash pre { color: #b9c8dd; white-space: pre-wrap; word-break: break-word; }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="stage"></canvas></div>

    <div id="boot">
      <h1>STACKMON</h1>
      <p>THE DISTRIBUTED REALM</p>
      <div class="bar"><i></i></div>
    </div>

    <div id="crash">
      <h2>RUNTIME PANIC</h2>
      <pre id="crash-body"></pre>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
